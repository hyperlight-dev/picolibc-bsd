name: License Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scancode:
    name: Scancode License Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install scancode-toolkit
        # scancode 32.3.0 breaks with pluggy 1.7 (plugin hooks not found) and
        # click 8.5 (--strip-root and --full-root always reported as conflicting).
        run: pip install 'scancode-toolkit==32.3.0' 'pluggy<1.7' 'click<8.5'

      - name: Test license policy checker
        run: python .github/workflows/test_check_license_policy.py

      - name: Scan licenses
        run: |
          scancode \
            --license \
            --license-policy license-policy.yml \
            --only-findings \
            --processes "$(nproc)" \
            --json-pp scancode-results.json \
            --ignore ".git/*" \
            --ignore ".github" \
            --ignore "scripts/import-upstream.sh" \
            --ignore "COPYLEFT_EXCLUSIONS" \
            --ignore "COPYING.picolibc" \
            --ignore "find-copyright" \
            --ignore "license-policy.yml" \
            --ignore "*/README" \
            --ignore "README.md" \
            --ignore "README.upstream.md" \
            .

      - name: Check for unapproved licenses
        run: python .github/workflows/check_license_policy.py scancode-results.json

      - name: Print detected licenses
        if: always()
        run: |
          jq -r '[.files[].license_detections[].license_expression_spdx] | unique | sort | .[]' scancode-results.json

      - name: Upload scancode results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scancode-results
          path: scancode-results.json

  exclusions-check:
    name: Copyleft Exclusions Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify excluded paths do not exist
        run: |
          awk '!/^#/ && NF { if (system("test ! -e " $0)) { print "ERROR: Excluded file found: " $0; exit 1 } }' COPYLEFT_EXCLUSIONS
          echo "All excluded paths are absent from the tree."
