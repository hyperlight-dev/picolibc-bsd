name: Update from Upstream

on:
  workflow_dispatch:
    inputs:
      to_ref:
        description: "Upstream release tag, branch, or commit to import up to, e.g., 1.9.0 or ff59ec82f"
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.to_ref }}
  cancel-in-progress: false

jobs:
  update:
    name: Import Upstream Commits
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push/delete the import branch.
      pull-requests: write # Needed to create/update the upstream PR.
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git --hostname github.com

      - name: Import upstream commits
        id: import
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TO_REF: ${{ inputs.to_ref }}
        run: |
          # Start from the nearest *-bsd tag on this branch; strip the suffix to get the upstream ref
          if ! base_tag=$(git describe --tags --abbrev=0 --match '*-bsd' HEAD); then
            echo "No *-bsd tag reachable from HEAD. Tag the initial import first (e.g., git tag 1.8.11-bsd)." >&2
            exit 1
          fi
          from="${base_tag%-bsd}"
          target=$(scripts/import-upstream.sh --describe "$TO_REF")

          branch="update-upstream-${target}"
          git branch -D "$branch" 2>/dev/null || true
          git push origin --delete "$branch" 2>/dev/null || true
          git checkout -b "$branch"

          scripts/import-upstream.sh "$from" "$target" 2>&1 | tee import-log.txt

          imported=$(grep -oP 'Imported: \K[0-9]+' import-log.txt || echo "0")
          {
            echo "imported=$imported"
            echo "branch=$branch"
            echo "from=$from"
            echo "target=$target"
            echo "from_sha=$(git rev-parse --verify "${from}^{commit}")"
            echo "target_sha=$(git rev-parse --verify "${target}^{commit}")"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update PR
        if: steps.import.outputs.imported != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ steps.import.outputs.target }}
          BRANCH: ${{ steps.import.outputs.branch }}
          FROM: ${{ steps.import.outputs.from }}
          FROM_SHA: ${{ steps.import.outputs.from_sha }}
          TARGET_SHA: ${{ steps.import.outputs.target_sha }}
        run: |
          git push origin "$BRANCH"

          # Generate PR body
          cat > pr-body.md <<EOF
          ## Upstream Update: picolibc ${TARGET}

          **Upstream compare**: [${FROM}...${TARGET}](https://github.com/picolibc/picolibc/compare/${FROM_SHA}...${TARGET_SHA})

          ### Imported commits
          $(git log --oneline main..HEAD | head -50)

          ### Checklist
          - [ ] Review imported commits
          - [ ] Verify license scan passes
          - [ ] Update version table in README.md
          - [ ] Merge with **rebase** to preserve commit history
          - [ ] After merge, tag will be created automatically
          EOF

          existing_pr=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null || true)
          if [[ -n "$existing_pr" ]]; then
            gh pr edit "$existing_pr" --title "Update from upstream picolibc ${TARGET}" --body-file pr-body.md
          else
            gh pr create --base main --head "$BRANCH" --title "Update from upstream picolibc ${TARGET}" --body-file pr-body.md
          fi
